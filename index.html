<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanBowl Online Ordering</title>
  <style>
    :root {
      --bg: #f5f6f1;
      --surface: #ffffff;
      --soft: #edf1ea;
      --text: #1f2930;
      --muted: #69757c;
      --line: #d9e0d8;
      --primary: #0f766e;
      --primary-dark: #0b5f59;
      --accent: #e7a934;
      --coral: #d9604b;
      --ink: #25333a;
      --success: #287a53;
      --shadow: 0 18px 46px rgba(31, 41, 48, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    h3 {
      margin-bottom: 0;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-chip::before {
      content: "";
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.36fr);
      grid-template-areas:
        "toolbar cart"
        "menu cart"
        "kitchen cart";
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .toolbar-panel {
      grid-area: toolbar;
    }

    .menu-panel {
      grid-area: menu;
    }

    .kitchen-panel {
      grid-area: kitchen;
    }

    .cart-panel {
      grid-area: cart;
      position: sticky;
      top: 18px;
    }

    .toolbar-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr 0.8fr;
      gap: 12px;
      align-items: end;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    textarea {
      min-height: 76px;
      padding-top: 10px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-button,
    .button,
    .qty-button {
      border: 0;
      font-weight: 900;
    }

    .tab-button {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }

    .tab-button.active {
      border-color: var(--primary);
      background: #e3f5f2;
      color: var(--primary-dark);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 8px;
      padding: 0 16px;
      white-space: nowrap;
    }

    .button.primary {
      background: var(--primary);
      color: #fff;
    }

    .button.primary:hover {
      background: var(--primary-dark);
    }

    .button.secondary {
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--text);
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .menu-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .menu-card {
      display: grid;
      grid-template-rows: 162px 1fr;
      min-height: 390px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .food-visual {
      position: relative;
      overflow: hidden;
      background: #e9efe8;
    }

    .food-visual::before,
    .food-visual::after,
    .food-plate,
    .food-detail {
      content: "";
      position: absolute;
      display: block;
    }

    .food-plate {
      left: 50%;
      top: 50%;
      width: 116px;
      height: 116px;
      border: 14px solid #fff;
      border-radius: 50%;
      background: #e7a934;
      box-shadow: 0 18px 32px rgba(31, 41, 48, 0.16);
      transform: translate(-50%, -44%);
    }

    .food-detail {
      left: 50%;
      top: 51%;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .visual-bowl {
      background: #e8f2ef;
    }

    .visual-bowl .food-detail {
      background:
        radial-gradient(circle at 28% 30%, #ffffff 0 9px, transparent 10px),
        radial-gradient(circle at 72% 35%, #d9604b 0 11px, transparent 12px),
        radial-gradient(circle at 38% 70%, #287a53 0 10px, transparent 11px),
        radial-gradient(circle at 70% 72%, #25333a 0 8px, transparent 9px),
        #f1cf72;
    }

    .visual-grill {
      background: #f2ece6;
    }

    .visual-grill .food-plate {
      background: #f3efe8;
    }

    .visual-grill .food-detail {
      border-radius: 18px;
      background:
        linear-gradient(90deg, transparent 0 16px, rgba(37, 51, 58, 0.18) 16px 20px, transparent 20px 34px, rgba(37, 51, 58, 0.18) 34px 38px, transparent 38px),
        #d9604b;
      transform: translate(-50%, -50%) rotate(-12deg);
    }

    .visual-dessert {
      background: #f4eee4;
    }

    .visual-dessert .food-plate {
      background: #fff7e5;
    }

    .visual-dessert .food-detail {
      width: 78px;
      height: 58px;
      border-radius: 10px 10px 24px 24px;
      background:
        radial-gradient(circle at 32% 20%, #ffffff 0 9px, transparent 10px),
        radial-gradient(circle at 62% 24%, #ffffff 0 9px, transparent 10px),
        linear-gradient(#d9604b 0 18px, #e7a934 18px);
      transform: translate(-50%, -46%);
    }

    .visual-drink {
      background: #e7f1f3;
    }

    .visual-drink .food-plate {
      width: 82px;
      height: 116px;
      border: 9px solid #fff;
      border-radius: 16px 16px 28px 28px;
      background: linear-gradient(#f5fcff 0 28%, #0f766e 28%);
      transform: translate(-50%, -46%);
    }

    .visual-drink .food-detail {
      left: calc(50% + 38px);
      top: 43%;
      width: 28px;
      height: 48px;
      border: 7px solid #fff;
      border-left: 0;
      border-radius: 0 18px 18px 0;
      background: transparent;
    }

    .menu-content {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      padding: 16px;
    }

    .menu-title-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .rating {
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #fff4d8;
      color: #6d4b00;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .description {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 6px;
    }

    .price {
      font-size: 22px;
      font-weight: 900;
      white-space: nowrap;
    }

    .cart-list {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .cart-item h3 {
      font-size: 14px;
      margin-bottom: 5px;
    }

    .cart-item small {
      color: var(--muted);
      font-weight: 800;
    }

    .qty-control {
      display: grid;
      grid-template-columns: 32px 34px 32px;
      align-items: center;
      gap: 4px;
    }

    .qty-button {
      height: 32px;
      border-radius: 8px;
      background: var(--soft);
      color: var(--text);
    }

    .qty-value {
      text-align: center;
      font-size: 14px;
      font-weight: 900;
    }

    .summary-lines {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .summary-lines div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .summary-lines span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .summary-lines strong {
      text-align: right;
    }

    .summary-lines .total {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .total strong {
      color: var(--primary-dark);
      font-size: 24px;
    }

    .checkout-form {
      display: grid;
      gap: 12px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .kitchen-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .kitchen-stat {
      min-height: 86px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .kitchen-stat span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .kitchen-stat strong {
      font-size: 18px;
    }

    .message {
      display: none;
      margin-top: 13px;
      padding: 12px;
      border-radius: 8px;
      background: #e7f5ee;
      color: #175c3d;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
    }

    .message.visible {
      display: block;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    @media (max-width: 1080px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-areas:
          "toolbar"
          "menu"
          "kitchen"
          "cart";
      }

      .cart-panel {
        position: static;
      }

      .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 20px, 560px);
        padding-top: 18px;
      }

      .topbar,
      .toolbar-grid,
      .menu-grid,
      .two-col,
      .kitchen-grid {
        display: grid;
        grid-template-columns: 1fr;
      }

      .section-heading {
        align-items: stretch;
        flex-direction: column;
      }

      .status-chip {
        width: fit-content;
      }

      .menu-card {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">U</div>
        <div>
          <p class="eyebrow">UrbanBowl</p>
          <h1>Modern food ordering</h1>
        </div>
      </div>
      <div class="status-chip">Kitchen open</div>
    </header>

    <main class="layout">
      <section class="panel toolbar-panel">
        <div class="toolbar-grid">
          <label>
            Search menu
            <input id="searchInput" type="search" placeholder="Search bowls, grills, drinks" />
          </label>
          <label>
            Sort
            <select id="sortSelect">
              <option value="popular">Most popular</option>
              <option value="priceLow">Lowest price</option>
              <option value="priceHigh">Highest price</option>
              <option value="fastest">Fastest prep</option>
            </select>
          </label>
          <label>
            Diet
            <select id="dietSelect">
              <option value="All">All</option>
              <option value="Veg">Veg</option>
              <option value="High protein">High protein</option>
              <option value="Light">Light</option>
            </select>
          </label>
        </div>
        <div id="categoryTabs" class="category-tabs"></div>
      </section>

      <section class="panel menu-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Menu</p>
            <h2>Fresh picks for today</h2>
          </div>
          <span id="menuCount" class="menu-count">0 items</span>
        </div>
        <div id="menuGrid" class="menu-grid"></div>
      </section>

      <section class="panel kitchen-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Kitchen status</p>
            <h2>Service snapshot</h2>
          </div>
        </div>
        <div class="kitchen-grid">
          <div class="kitchen-stat"><span>Average prep</span><strong id="avgPrep">-</strong></div>
          <div class="kitchen-stat"><span>Cart items</span><strong id="cartItems">0</strong></div>
          <div class="kitchen-stat"><span>Pickup window</span><strong>25 min</strong></div>
          <div class="kitchen-stat"><span>Rating</span><strong>4.8 / 5</strong></div>
        </div>
      </section>

      <aside class="panel cart-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Checkout</p>
            <h2>Your order</h2>
          </div>
        </div>
        <div id="cartList" class="cart-list"></div>
        <div class="summary-lines">
          <div><span>Subtotal</span><strong id="subtotal">Rs 0</strong></div>
          <div><span>Packaging</span><strong id="packaging">Rs 0</strong></div>
          <div><span>Taxes</span><strong id="taxes">Rs 0</strong></div>
          <div class="total"><span>Total</span><strong id="total">Rs 0</strong></div>
        </div>
        <form id="checkoutForm" class="checkout-form">
          <div class="two-col">
            <label>
              Method
              <select id="orderMethod">
                <option value="Pickup">Pickup</option>
                <option value="Delivery">Delivery</option>
              </select>
            </label>
            <label>
              Time
              <select id="timeSlot">
                <option>ASAP</option>
                <option>12:30 PM</option>
                <option>01:00 PM</option>
                <option>01:30 PM</option>
                <option>02:00 PM</option>
              </select>
            </label>
          </div>
          <label>
            Name
            <input id="customerName" type="text" placeholder="Enter your name" required />
          </label>
          <label>
            Order notes
            <textarea id="orderNotes" placeholder="Less spice, no onion, extra cutlery"></textarea>
          </label>
          <button class="button primary" type="submit">Place order</button>
        </form>
        <div id="message" class="message"></div>
      </aside>
    </main>
  </div>

  <script>
    const menuItems = [
      {
        id: "m1",
        name: "Harvest Protein Bowl",
        category: "Bowls",
        diet: "High protein",
        price: 349,
        prep: 18,
        rating: 4.9,
        visual: "visual-bowl",
        description: "Brown rice, grilled paneer, chickpeas, greens, seeds, and herb dressing."
      },
      {
        id: "m2",
        name: "Charcoal Chicken Plate",
        category: "Grill",
        diet: "High protein",
        price: 429,
        prep: 22,
        rating: 4.8,
        visual: "visual-grill",
        description: "Smoky grilled chicken with lemon rice, salad, and garlic yogurt sauce."
      },
      {
        id: "m3",
        name: "Citrus Quinoa Bowl",
        category: "Bowls",
        diet: "Veg",
        price: 319,
        prep: 16,
        rating: 4.7,
        visual: "visual-bowl",
        description: "Quinoa, roasted vegetables, orange glaze, avocado, and crunchy greens."
      },
      {
        id: "m4",
        name: "Cold Brew Tonic",
        category: "Drinks",
        diet: "Light",
        price: 189,
        prep: 6,
        rating: 4.6,
        visual: "visual-drink",
        description: "Cold brew coffee topped with citrus tonic and a clean sparkling finish."
      },
      {
        id: "m5",
        name: "Paneer Fire Grill",
        category: "Grill",
        diet: "Veg",
        price: 379,
        prep: 20,
        rating: 4.8,
        visual: "visual-grill",
        description: "Tandoori paneer, charred peppers, mint chutney, and warm millet flatbread."
      },
      {
        id: "m6",
        name: "Berry Cream Slice",
        category: "Desserts",
        diet: "Veg",
        price: 229,
        prep: 8,
        rating: 4.7,
        visual: "visual-dessert",
        description: "Soft vanilla sponge layered with berry compote and light cream."
      },
      {
        id: "m7",
        name: "Iced Matcha Cloud",
        category: "Drinks",
        diet: "Light",
        price: 209,
        prep: 7,
        rating: 4.5,
        visual: "visual-drink",
        description: "Ceremonial matcha, chilled milk, soft foam, and a touch of honey."
      },
      {
        id: "m8",
        name: "Chocolate Crunch Jar",
        category: "Desserts",
        diet: "Veg",
        price: 249,
        prep: 9,
        rating: 4.9,
        visual: "visual-dessert",
        description: "Dark chocolate mousse, cookie crumble, cocoa nibs, and vanilla cream."
      },
      {
        id: "m9",
        name: "Lean Herb Fish",
        category: "Grill",
        diet: "Light",
        price: 459,
        prep: 24,
        rating: 4.6,
        visual: "visual-grill",
        description: "Herb grilled fish with steamed vegetables and lemon caper dressing."
      }
    ];

    const categories = ["All", "Bowls", "Grill", "Drinks", "Desserts"];
    const cart = new Map();
    let activeCategory = "All";

    const el = {
      searchInput: document.getElementById("searchInput"),
      sortSelect: document.getElementById("sortSelect"),
      dietSelect: document.getElementById("dietSelect"),
      categoryTabs: document.getElementById("categoryTabs"),
      menuGrid: document.getElementById("menuGrid"),
      menuCount: document.getElementById("menuCount"),
      cartList: document.getElementById("cartList"),
      subtotal: document.getElementById("subtotal"),
      packaging: document.getElementById("packaging"),
      taxes: document.getElementById("taxes"),
      total: document.getElementById("total"),
      avgPrep: document.getElementById("avgPrep"),
      cartItems: document.getElementById("cartItems"),
      checkoutForm: document.getElementById("checkoutForm"),
      customerName: document.getElementById("customerName"),
      orderMethod: document.getElementById("orderMethod"),
      message: document.getElementById("message")
    };

    function init() {
      renderTabs();
      bindEvents();
      render();
    }

    function renderTabs() {
      el.categoryTabs.innerHTML = categories.map((category) => `
        <button class="tab-button${category === activeCategory ? " active" : ""}" type="button" data-category="${category}">
          ${category}
        </button>
      `).join("");
    }

    function bindEvents() {
      el.searchInput.addEventListener("input", render);
      el.sortSelect.addEventListener("change", render);
      el.dietSelect.addEventListener("change", render);

      el.categoryTabs.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        activeCategory = button.dataset.category;
        renderTabs();
        render();
      });

      el.checkoutForm.addEventListener("submit", placeOrder);
    }

    function render() {
      const items = getVisibleItems();
      renderMenu(items);
      renderCart();
      renderKitchen(items);
    }

    function getVisibleItems() {
      const query = el.searchInput.value.trim().toLowerCase();
      const diet = el.dietSelect.value;
      const sort = el.sortSelect.value;

      const filtered = menuItems
        .filter((item) => activeCategory === "All" || item.category === activeCategory)
        .filter((item) => diet === "All" || item.diet === diet)
        .filter((item) => !query || `${item.name} ${item.category} ${item.description}`.toLowerCase().includes(query));

      if (sort === "priceLow") filtered.sort((a, b) => a.price - b.price);
      if (sort === "priceHigh") filtered.sort((a, b) => b.price - a.price);
      if (sort === "fastest") filtered.sort((a, b) => a.prep - b.prep);
      if (sort === "popular") filtered.sort((a, b) => b.rating - a.rating);

      return filtered;
    }

    function renderMenu(items) {
      el.menuCount.textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;

      if (!items.length) {
        el.menuGrid.innerHTML = '<div class="empty">No dishes match the current filters. Try a different category or search term.</div>';
        return;
      }

      el.menuGrid.innerHTML = items.map((item) => `
        <article class="menu-card">
          <div class="food-visual ${item.visual}">
            <span class="food-plate"></span>
            <span class="food-detail"></span>
          </div>
          <div class="menu-content">
            <div class="menu-title-row">
              <h3>${item.name}</h3>
              <span class="rating">${item.rating.toFixed(1)}</span>
            </div>
            <div class="meta-row">
              <span class="tag">${item.category}</span>
              <span class="tag">${item.diet}</span>
              <span class="tag">${item.prep} min</span>
            </div>
            <p class="description">${item.description}</p>
            <div class="card-footer">
              <div class="price">${money(item.price)}</div>
              <button class="button secondary" type="button" onclick="addToCart('${item.id}')">Add</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function addToCart(id) {
      const current = cart.get(id) || 0;
      cart.set(id, current + 1);
      hideMessage();
      renderCart();
      renderKitchen(getVisibleItems());
    }

    function changeQty(id, amount) {
      const next = (cart.get(id) || 0) + amount;
      if (next <= 0) cart.delete(id);
      else cart.set(id, next);
      hideMessage();
      renderCart();
      renderKitchen(getVisibleItems());
    }

    function renderCart() {
      const entries = [...cart.entries()];

      if (!entries.length) {
        el.cartList.innerHTML = '<div class="empty">Your cart is empty. Add dishes from the menu to start an order.</div>';
      } else {
        el.cartList.innerHTML = entries.map(([id, qty]) => {
          const item = menuItems.find((dish) => dish.id === id);
          return `
            <div class="cart-item">
              <div>
                <h3>${item.name}</h3>
                <small>${money(item.price)} each</small>
              </div>
              <div class="qty-control">
                <button class="qty-button" type="button" onclick="changeQty('${id}', -1)">-</button>
                <span class="qty-value">${qty}</span>
                <button class="qty-button" type="button" onclick="changeQty('${id}', 1)">+</button>
              </div>
            </div>
          `;
        }).join("");
      }

      const subtotal = entries.reduce((total, [id, qty]) => {
        const item = menuItems.find((dish) => dish.id === id);
        return total + item.price * qty;
      }, 0);
      const packaging = entries.length ? 35 : 0;
      const taxes = Math.round(subtotal * 0.05);
      const total = subtotal + packaging + taxes;

      el.subtotal.textContent = money(subtotal);
      el.packaging.textContent = money(packaging);
      el.taxes.textContent = money(taxes);
      el.total.textContent = money(total);
      el.cartItems.textContent = entries.reduce((totalQty, [, qty]) => totalQty + qty, 0);
    }

    function renderKitchen(items) {
      if (!items.length) {
        el.avgPrep.textContent = "-";
        return;
      }
      const avg = Math.round(items.reduce((total, item) => total + item.prep, 0) / items.length);
      el.avgPrep.textContent = `${avg} min`;
    }

    function placeOrder(event) {
      event.preventDefault();

      if (!cart.size) {
        showMessage("Add at least one dish before placing the order.");
        return;
      }

      const name = el.customerName.value.trim();
      if (!name) {
        showMessage("Enter your name to confirm the order.");
        return;
      }

      const orderId = `UB${Math.floor(100000 + Math.random() * 900000)}`;
      showMessage(`Order ${orderId} confirmed for ${name}. ${el.orderMethod.value} is scheduled for the selected time.`);
      cart.clear();
      renderCart();
      renderKitchen(getVisibleItems());
      el.checkoutForm.reset();
    }

    function money(value) {
      return `Rs ${value.toLocaleString("en-IN")}`;
    }

    function showMessage(text) {
      el.message.textContent = text;
      el.message.classList.add("visible");
    }

    function hideMessage() {
      el.message.classList.remove("visible");
    }

    window.addToCart = addToCart;
    window.changeQty = changeQty;
    init();
  </script>
</body>
</html>
